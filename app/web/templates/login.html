<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Garmin to Strava</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        strava: {
                            DEFAULT: '#FC4C02',
                            hover: '#E34402',
                            dark: '#C83B00'
                        },
                        garmin: {
                            DEFAULT: '#007CC3',
                            hover: '#0066A2',
                            dark: '#004F7E'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="h-full flex items-center justify-center p-4 font-sans antialiased selection:bg-strava selection:text-white">

    <div class="max-w-md w-full space-y-6">
        
        <!-- Logo & Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center space-x-2 bg-slate-900 p-2.5 rounded-2xl border border-slate-800 shadow-lg">
                <span class="text-garmin font-black tracking-tight text-xl">GARMIN</span>
                <i data-lucide="arrow-right" class="w-5 h-5 text-slate-400"></i>
                <span class="text-strava font-black tracking-tight text-xl">STRAVA</span>
            </div>
            <h2 class="text-2xl font-bold text-slate-100 tracking-tight">Connexion à votre espace</h2>
            <p class="text-xs text-slate-400">Accédez à votre tableau de bord de synchronisation d'activités</p>
        </div>

        <!-- Login Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
            <form id="auth-login-form" onsubmit="handleAuthLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Adresse Email</label>
                    <div class="relative">
                        <i data-lucide="mail" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="email" id="login-email" required class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-800/80 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-strava transition" placeholder="votre.email@exemple.com">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Mot de passe</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="password" id="login-password" required class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-800/80 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-strava transition" placeholder="••••••••••••">
                    </div>
                </div>

                <button type="submit" id="btn-login-submit" class="w-full py-3 px-4 rounded-xl bg-strava hover:bg-strava-hover text-white font-semibold text-sm transition shadow-md active:scale-95 flex items-center justify-center space-x-2">
                    <span>Se connecter</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <div class="pt-4 border-t border-slate-800 text-center text-xs text-slate-400">
                Pas encore de compte ? 
                <a href="/register" class="text-strava hover:underline font-semibold ml-1">Créer un compte</a>
            </div>
        </div>

    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 space-y-3 max-w-sm w-full"></div>

    <script src="/static/js/app.js"></script>
    <script>
        lucide.createIcons();

        async function handleAuthLogin(e) {
            e.preventDefault();
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;
            const btn = document.getElementById("btn-login-submit");

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Connexion...</span>`;
            lucide.createIcons();

            try {
                const resp = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await resp.json();
                if (!resp.ok) throw new Error(data.detail || "Identifiants invalides.");

                showToast("Connexion réussie ! Redirection...", "success");
                
                const urlParams = new URLSearchParams(window.location.search);
                const nextUrl = urlParams.get("next") || "/";
                setTimeout(() => {
                    window.location.href = nextUrl;
                }, 400);

            } catch (err) {
                showToast(err.message, "error");
                btn.disabled = false;
                btn.innerHTML = `<span>Se connecter</span><i data-lucide="arrow-right" class="w-4 h-4"></i>`;
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" class="h-full bg-neutral-100 text-neutral-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Garmin to Strava</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        strava: { DEFAULT: '#FC4C02', hover: '#E34402' },
                        garmin: { DEFAULT: '#007CC3' }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="h-full flex items-center justify-center p-4 font-sans antialiased">

    <div class="max-w-sm w-full">

        <div class="mb-8 text-center">
            <p class="text-xs font-medium tracking-wide text-neutral-400 uppercase">Garmin → Strava</p>
            <h1 class="mt-1 text-xl font-semibold text-neutral-900">Connexion</h1>
        </div>

        <div class="bg-white border border-neutral-200 rounded-lg shadow-sm p-7">
            <form id="auth-login-form" onsubmit="handleAuthLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-neutral-600 mb-1.5">Email</label>
                    <input type="email" id="login-email" required autofocus
                        class="w-full px-3 py-2 text-sm bg-white border border-neutral-300 rounded-md text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-neutral-900 transition"
                        placeholder="vous@exemple.com">
                </div>

                <div>
                    <label class="block text-xs font-medium text-neutral-600 mb-1.5">Mot de passe</label>
                    <input type="password" id="login-password" required
                        class="w-full px-3 py-2 text-sm bg-white border border-neutral-300 rounded-md text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-neutral-900 transition"
                        placeholder="••••••••••••">
                </div>

                <button type="submit" id="btn-login-submit"
                    class="w-full py-2.5 rounded-md bg-strava hover:bg-strava-hover text-white font-medium text-sm shadow-sm transition flex items-center justify-center">
                    <span>Se connecter</span>
                </button>
            </form>
        </div>

        <p class="mt-6 text-center text-xs text-neutral-500">
            Pas encore de compte ?
            <a href="/register" class="text-neutral-900 font-medium hover:underline">Créer un compte</a>
        </p>

    </div>

    <div id="toast-container" class="fixed bottom-6 right-6 z-50 space-y-2 max-w-sm w-full"></div>

    <script src="/static/js/app.js"></script>
    <script>
        lucide.createIcons();

        async function handleAuthLogin(e) {
            e.preventDefault();
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;
            const btn = document.getElementById("btn-login-submit");

            btn.disabled = true;
            btn.textContent = "Connexion...";

            try {
                const resp = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await resp.json();
                if (!resp.ok) throw new Error(data.detail || "Identifiants invalides.");

                showToast("Connexion réussie", "success");

                const urlParams = new URLSearchParams(window.location.search);
                const nextUrl = urlParams.get("next") || "/";
                setTimeout(() => {
                    window.location.href = nextUrl;
                }, 300);

            } catch (err) {
                showToast(err.message, "error");
                btn.disabled = false;
                btn.textContent = "Se connecter";
            }
        }
    </script>
</body>
</html>
